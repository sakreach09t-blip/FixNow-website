<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixNow - You are offline</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
        color: var(--text);
      }

      .card {
        width: min(90vw, 560px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.5);
        padding: 2.25rem 2rem;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin-bottom: 1rem;
        border-radius: 50%;
        background: rgba(34, 197, 94, 0.18);
        font-size: 2.2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        font-weight: 700;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #04120a;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="badge" aria-hidden="true">📶</div>
      <h1>You're offline</h1>
      <p>
        FixNow needs an internet connection to load the latest services and technician details.
        Please reconnect and try again.
      </p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
